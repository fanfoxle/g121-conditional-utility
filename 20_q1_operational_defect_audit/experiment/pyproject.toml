[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oasst1-natural-filter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
